services:
  db:
    image: postgres:17-alpine
    container_name: db_carrier
    environment:
      POSTGRES_DB: carrier
      POSTGRES_USER: carrierDb
      POSTGRES_PASSWORD: carrier_bd
    ports:
      - "5676:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - carrier-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carrierDb -d carrier_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local

networks:
  carrier-network:
    external: true
    name: carrier-network